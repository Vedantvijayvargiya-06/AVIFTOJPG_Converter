version: '3.8'

services:
  pixora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pixora-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - STORAGE_DIR=/tmp/pixora
      - MAX_FILE_SIZE_MB=25
      - MAX_FILES_PER_BATCH=20
      - MAX_BATCH_TOTAL_MB=150
      - DEFAULT_JPEG_QUALITY=90
      - RETENTION_MINUTES=30
    volumes:
      - pixora-data:/tmp/pixora
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G

volumes:
  pixora-data:
